[package]
name = "saas-adapter"
version = "0.2.0"
edition = "2021"
description = "SOLID + multithreaded adapter layer for Substrate SaaS"

[features]
default = ["memory"]
memory = []
postgres = ["sqlx"]
redis-cache = ["redis"]
nats = ["async-nats"]
substrate-rpc = ["jsonrpsee"]
full = ["postgres", "redis-cache", "nats", "substrate-rpc"]

[dependencies]
tokio = { version = "=1.35.1", features = ["full"] }
async-trait = "=0.1.74"
serde = { version = "=1.0.193", features = ["derive"] }
serde_json = "=1.0.108"
thiserror = "=1.0.50"
tracing = "=0.1.40"
tracing-subscriber = "=0.3.18"
dashmap = "=5.5.3"
hashbrown = "=0.14.5"
parking_lot = "=0.12.1"
uuid = { version = "=1.6.1", features = ["v4", "serde"] }
chrono = { version = "=0.4.31", features = ["serde"] }
base64 = "=0.21.7"
sha2 = "=0.10.8"
hex = "=0.4.3"

sqlx = { version = "0.7", optional = true, default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
redis = { version = "0.24", optional = true, default-features = false, features = ["tokio-comp", "connection-manager"] }
async-nats = { version = "0.33", optional = true }
jsonrpsee = { version = "0.20", optional = true, features = ["client", "ws-client", "http-client"] }

[dev-dependencies]
tokio-test = "=0.4.3"
