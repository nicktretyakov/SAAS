[package]
name = "saas-api"
version = "0.2.0"
edition = "2021"
description = "HTTP API for Substrate SaaS (hyper + auth + billing)"

[features]
default = []
postgres = ["saas-adapter/postgres"]
redis-cache = ["saas-adapter/redis-cache"]
nats = ["saas-adapter/nats"]
substrate-rpc = ["saas-adapter/substrate-rpc"]
full = ["postgres", "redis-cache", "nats", "substrate-rpc"]

[dependencies]
tokio = { version = "=1.35.1", features = ["full"] }
hyper = { version = "=0.14.28", features = ["full"] }
serde = { version = "=1.0.193", features = ["derive"] }
serde_json = "=1.0.108"
uuid = { version = "=1.6.1", features = ["v4", "serde"] }
chrono = { version = "=0.4.31", features = ["serde"] }
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter"] }
thiserror = "=1.0.50"
async-trait = "=0.1.74"
bytes = "=1.5.0"
hashbrown = "=0.14.5"
indexmap = "=2.2.6"

saas-adapter = { path = "../adapter" }
