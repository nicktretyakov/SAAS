# Optional infra for production adapters
# docker compose up -d
version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
      POSTGRES_DB: saas
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]

  # substrate-contracts-node — optional local chain
  # substrate:
  #   image: paritytech/contracts-node:latest
  #   command: ["--dev", "--tmp", "--rpc-external", "--rpc-cors=all"]
  #   ports: ["9944:9944"]

volumes:
  pgdata:
